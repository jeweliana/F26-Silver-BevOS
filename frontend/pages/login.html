<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in · Silver-BevOS</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
  </head>
  <body>
    <!-- <header class="topbar">
    <a class="brand" href="../index.html">Silver·BevOS</a>
  </header> -->

    <div id="nav_container">
      <div class="nav_content">
        <h1>BevOS</h1>
        <h4>OPERATIONS</h4>

        <a href="../index.html"
          ><button>
            <img class="icon" src="../icons/dashboard.svg" /> Dashboard
          </button></a
        >
        <a href="../pages/analytics.html"
          ><button>
            <img class="icon" src="../icons/analytics.svg" />Analytics
          </button></a
        >
        <a href="../pages/deals.html"
          ><button>
            <img class="icon" src="../icons/deals.svg" />Deals
          </button></a
        >
        <a href="../pages/login.html"
          ><button style="background-color: rgb(48, 67, 104)">
            <img class="icon" src="../icons/log-in.svg" />Login
          </button></a
        >
      </div>
    </div>

    <main class="container login-page">
      <div class="login-card">
        <div class="login-header">
          <div id="auth-message" hidden></div>
          <div class="login-icon"><i class="ti ti-lock"></i></div>
          <h1>Welcome back</h1>
          <p class="muted">Sign in to your BevOS account</p>
        </div>
        <form id="login-form" class="stack">
          <label
            >Username
            <input name="username" autocomplete="username" required />
          </label>
          <label
            >Password
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button type="submit">Log In</button>
          <p id="login-error" class="error" role="alert" hidden></p>
        </form>
      </div>
    </main>
  </body>
</html>
