<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deals · Silver-BevOS</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/deals.js" defer></script>
    <script src="../js/protect.js" defer></script>
    <script src="../js/app.js" defer></script>
  </head>
  <body>
    <div id="app" hidden>
      <header class="topbar">
        <!-- <a class="brand" href="../index.html">Silver·BevOS</a>
    <nav class="nav">
      <a href="../index.html">Home</a>
      <a href="./deals.html" class="active">Deals</a>
      <a href="./analytics.html">Analytics</a>
    </nav> -->
      </header>

      <div id="nav_container">
        <div class="nav_content">
          <h1>BevOS</h1>
          <h4>OPERATIONS</h4>

          <a href="../index.html"
            ><button>
              <img class="icon" src="../icons/dashboard.svg" /> Dashboard
            </button></a
          >
          <a href="../pages/analytics.html"
            ><button>
              <img class="icon" src="../icons/analytics.svg" />Analytics
            </button></a
          >
          <a href="../pages/deals.html"
            ><button style="background-color: rgb(48, 67, 104)">
              <img class="icon" src="../icons/deals.svg" />Deals
            </button></a
          >
          <a href="../pages/admin.html" id="admin-link" hidden>
            <button>
              <img class="icon" src="../icons/admin.svg" />
              Administration
            </button>
          </a>
          <a href="#" data-auth-link="logout" hidden
            ><button>
              <img class="icon" src="../icons/log-in.svg" />Logout
            </button></a
          >
        </div>
      </div>

      <main class="container">
        <section class="hero">
          <h1>Deals</h1>
          <p class="muted">Manage and track beverage packaging deals.</p>
        </section>

        <section class="card">
          <h2>All Deals</h2>

          <input type="search" id="deal-search" placeholder="Search deals..." />

          <!-- Edit Deal Panel -->

          <section id="edit-deal-panel" class="card" hidden>
            <h2>Edit Deal</h2>

            <form id="edit-deal-form">
              <input type="hidden" id="edit-deal-id" />

              <label>Deal Name</label>
              <input type="text" id="edit-deal-name" required />

              <label for="edit-deal-client">Customer</label>
              <select id="edit-deal-client" required>
                <option value="">Select a customer</option>
              </select>

              <label for="edit-deal-status">Status</label>
              <select id="edit-deal-status" required>
                <option value="Pending">Pending</option>
                <option value="Active">Active</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
              </select>

              <button type="submit">Save Changes</button>
              <button type="button" id="cancel-edit">Cancel</button>
            </form>
          </section>

          <p id="deals-status" class="muted">Loading deals...</p>

          <div class="deals-table-wrapper">
            <table class="deals-table">
              <thead>
                <tr>
                  <th>Deal ID</th>
                  <th>Deal Name</th>
                  <th>Customer</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody id="deals-table-body">
                <tr>
                  <td colspan="5">Loading deals...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
