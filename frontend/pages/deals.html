<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deals · Silver-BevOS</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/deals.js" defer></script>
    <script src="../js/protect.js" defer></script>
    <script src="../js/app.js" defer></script>
  </head>
  <body>
    <div id="app" hidden>
      <header class="topbar">
      </header>

      <div id="nav_container">
        <div class="nav_content">
          <h1>BevOS</h1>
          <h4>OPERATIONS</h4>

          <a href="../index.html"
            ><button>
              <img class="icon" src="../icons/dashboard.svg" /> Dashboard
            </button></a
          >
          <a href="../pages/analytics.html"
            ><button>
              <img class="icon" src="../icons/analytics.svg" />Analytics
            </button></a
          >
          <a href="../pages/deals.html"
            ><button style="background-color: rgb(48, 67, 104)">
              <img class="icon" src="../icons/deals.svg" />Deals
            </button></a
          >
          <a href="../pages/admin.html" id="admin-link" hidden>
            <button>
              <img class="icon" src="../icons/admin.svg" />
              Administration
            </button>
          </a>
          <a href="#" data-auth-link="logout" hidden
            ><button>
              <img class="icon" src="../icons/log-in.svg" />Logout
            </button></a
          >
        </div>
      </div>

      <main class="container">
        <section class="hero">
          <h1>Deals</h1>
          <p class="muted">Manage and track beverage packaging deals.</p>
        </section>

        
    <section class="card">
      <div class="deals-heading">
        <h2>All Deals</h2>

        <div class="deals-create-actions">
          <button type="button" id="new-customer-btn" class="secondary-action">
            <svg viewBox="0 0 24 24" width="18" height="18"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M20 8v6M17 11h6"/>
            </svg>
            New Customer
          </button>

          <button type="button" id="new-deal-btn">
            <span aria-hidden="true">+</span> New Deal
          </button>
        </div>
      </div>

  <input type="search" id="deal-search" placeholder="Search deals..." />

          <p id="deals-status" class="muted">Loading deals...</p>

          <div class="deals-table-wrapper">
            <table class="deals-table">
              <thead>
                <tr>
                  <th>Deal ID</th>
                  <th>Deal Name</th>
                  <th>Customer</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody id="deals-table-body">
                <tr>
                  <td colspan="5">Loading deals...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

<!-- Create Customer -->
<section id="new-customer-panel" class="card creation-panel" hidden>
  <h2>Add New Customer</h2>
  <p class="muted">Register a new company in BevOS.</p>

  <form id="new-customer-form" class="creation-form">
    <label>
      Company Name *
      <input name="client_name" required maxlength="200">
    </label>

    <label>
      Contact Name
      <input name="contact_name" maxlength="200">
    </label>

    <label>
      Email
      <input name="email" type="email" maxlength="320">
    </label>

    <label>
      Phone
      <input name="phone" type="tel" maxlength="50">
    </label>

    <label class="form-full">
      Address
      <textarea name="address" rows="2"></textarea>
    </label>

    <label class="form-full">
      Notes
      <textarea name="notes" rows="2"></textarea>
    </label>

    <div class="form-buttons">
      <button type="submit">Save Customer</button>
      <button type="button" id="cancel-new-customer"
              class="secondary-action">Cancel</button>
    </div>

    <p id="customer-form-message" class="form-full"
       role="status" aria-live="polite"></p>
  </form>
</section>

<!-- Create Deal -->
<section id="new-deal-panel" class="card creation-panel" hidden>
  <h2>Create New Deal</h2>
  <p class="muted">Create a deal for an existing customer.</p>

  <form id="new-deal-form" class="creation-form">
    <label>
      Deal Number *
      <input name="deal_number" required maxlength="100"
             placeholder="DEAL-2026-001">
    </label>

    <label>
      Deal Name *
      <input name="deal_name" required maxlength="255"
             placeholder="Beverage Packaging">
    </label>

    <label>
      Customer *
      <select name="client" id="new-deal-client" required>
        <option value="">Select customer</option>
      </select>
    </label>

    <label>
      Status *
      <select name="status" id="new-deal-status" required>
        <option value="">Select status</option>
      </select>
    </label>

    <label>
      Target Date
      <input name="target_date" type="date">
    </label>

    <label class="form-full">
      Notes
      <textarea name="notes" rows="3"></textarea>
    </label>

    <div class="form-buttons">
      <button type="submit">Save Deal</button>
      <button type="button" id="cancel-new-deal"
              class="secondary-action">Cancel</button>
    </div>

    <p id="deal-form-message" class="form-full"
       role="status" aria-live="polite"></p>
  </form>
</section>


        <!-- Deal Details Panel -->
        <section id="deal-details-panel" class="card" hidden>
          <div class="row deal-details-header">
            <h2>Deal Details</h2>

            <div class="deal-details-actions">
              <button type="button" id="edit-deal-button">Edit Deal</button>

              <button type="button" id="save-deal-button" hidden>
                Save Changes
              </button>

              <button type="button" id="cancel-edit" hidden>Cancel</button>

              <button type="button" id="close-deal-details">Close</button>
            </div>
          </div>

          <div id="deal-details-content">
            <!-- Deal summary and tabbed tables will be loaded here -->
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
