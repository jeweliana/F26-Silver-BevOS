<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Administration · Silver-BevOS</title>

    <link rel="stylesheet" href="../css/styles.css" />

    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/admin.js" defer></script>
  </head>

  <body>
    <div id="app" hidden>
      <div id="nav_container">
        <div class="nav_content">
          <h1>BevOS</h1>
          <h4>OPERATIONS</h4>

          <a href="../index.html">
            <button>
              <img class="icon" src="../icons/dashboard.svg" /> Dashboard
            </button>
          </a>

          <a href="../pages/analytics.html">
            <button>
              <img class="icon" src="../icons/analytics.svg" /> Analytics
            </button>
          </a>

          <a href="../pages/deals.html">
            <button><img class="icon" src="../icons/deals.svg" /> Deals</button>
          </a>

          <a href="../pages/admin.html">
            <button style="background-color: rgb(48, 67, 104)">
              Administration
            </button>
          </a>

          <a href="../pages/login.html" data-auth-link="login">
            <button>
              <img class="icon" src="../icons/log-in.svg" /> Login
            </button>
          </a>

          <a href="#" data-auth-link="logout" hidden>
            <button>Logout</button>
          </a>
        </div>
      </div>

      <main class="container">
        <section class="hero">
          <h1>Account Administration</h1>
          <p class="muted">Create, manage, and remove Silver-BevOS accounts.</p>
        </section>

        <!-- Create account -->
        <section class="card">
          <h2>Create Account</h2>

          <form id="create-user-form" class="stack">
            <label>
              Username
              <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
              />
            </label>

            <label>
              Email
              <input
                type="email"
                name="email"
                placeholder="Enter email address"
                required
              />
            </label>

            <label>
              Password
              <input
                type="password"
                name="password"
                placeholder="Enter temporary password"
                minlength="8"
                required
              />
            </label>

            <label>
              Account Type
              <select name="role" required>
                <option value="staff">Staff</option>
                <option value="manager">Manager</option>
                <option value="admin">Administrator</option>
              </select>
            </label>

            <button type="submit">Create Account</button>

            <p id="create-user-status" role="status" hidden></p>
          </form>
        </section>

        <!-- Account list -->
        <section class="card">
          <h2>Manage Accounts</h2>

          <input
            type="search"
            id="user-search"
            placeholder="Search accounts..."
          />

          <p id="users-status" class="muted">Loading accounts...</p>

          <div class="deals-table-wrapper">
            <table class="deals-table">
              <thead>
                <tr>
                  <th>Username</th>
                  <th>Email</th>
                  <th>Account Type</th>
                  <th>Action</th>
                </tr>
              </thead>

              <tbody id="users-table-body">
                <tr>
                  <td colspan="4">Loading accounts...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
